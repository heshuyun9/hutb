name: hubt Linux CI/CD

on:
   pull_request:
   workflow_dispatch:

jobs:
    linux-dev:
             name: Linux CI/CD
             timeout-minutes: 1440
             runs-on: [self-hosted, yxkj-hutb]
            #  runs-on: [self-hosted, dev]

             env:
                 UE4_ROOT: /home/yxkj/UnrealEngine_4.26

             steps:
                  - name: Checkout repository
                    uses: actions/checkout@v5
                    with:
                         fetch-depth: 0
                         clean: false

                  - name: Show files
                    run: |
                       pwd
                       ls -al

                  - name: Reuse local assets
                    run: |
                       if [ ! -d Build/dependencies ]; then
                         cp -a /home/yxkj/ci-assets/dependencies Build/dependencies
                         echo "dependencies copied"
                       fi
                       if [ ! -e Unreal/CarlaUE4/Content ] || [ -z "$(ls -A Unreal/CarlaUE4/Content 2>/dev/null)" ]; then
                         rm -rf Unreal/CarlaUE4/Content
                         ln -s /home/yxkj/hutb/Unreal/CarlaUE4/Content Unreal/CarlaUE4/Content
                         echo "Content linked"
                       fi
                    shell: bash

                  - name: Ensure origin/master refs
                    run: |
                       for g in $(find . -maxdepth 4 -type d -name .git -prune -print | sed 's#/.git$##'); do
                         echo "--- $g"
                         git -C "$g" fetch origin master:refs/remotes/origin/master --depth=1 2>/dev/null || true
                         git -C "$g" show-ref --verify --quiet refs/remotes/origin/master || \
                           git -C "$g" update-ref refs/remotes/origin/master HEAD
                         git -C "$g" show-ref | grep -E "origin/(master|hutb)" || true
                       done
                    shell: bash

                  - name: Patch origin/master references
                    run: |
                       FILES=$(grep -rln "origin/master" Util Unreal --include="*.sh" --include="*.mk" --include="Makefile" 2>/dev/null || true)
                       echo "=== 将被修改的文件 ==="
                       echo "$FILES"
                       for f in $FILES; do
                         sed -i 's#origin/master#HEAD#g' "$f"
                       done
                       echo "=== 修改后仍存在 origin/master 的文件 ==="
                       grep -rln "origin/master" Util Unreal --include="*.sh" --include="*.mk" --include="Makefile" 2>/dev/null || echo "(无)"
                       echo "=== BuildUE4Plugins.sh 105-125 行 ==="
                       sed -n '105,125p' Util/BuildTools/BuildUE4Plugins.sh 2>/dev/null || true
                    shell: bash

                  - name: setup
                  
                    run: |
                       source ./setEnv64.sh
                       git update-index --skip-worktree Unreal/CarlaUE4/CarlaUE4.uproject

                       # Clean leftover source dirs from previous runs (avoid conflict with make setup)
                       rm -rf Build/*-source Build/*-src 2>/dev/null || true

                       # setup.sh 负责 clone dependencies_u、解压 UE4 插件与
                       #  UnrealRoboticsLab 三方依赖、安装 miniconda3、apt 依赖并编译 C++ 依赖
                       ./setup.sh

                       make setup ARGS="--chrono"
                    shell: bash
                 
                  - name: build 
                    run: |
                       source ./setEnv64.sh 
                       make plugins 
                    shell: bash  

                  - name: retrieve content
                    run: | 
                       source ./setEnv64.sh 
                       source ./Update.sh  
                    shell: bash 
                  
                  - name: Fix Windows Compiler Flags and Clean Cache
                    run: |
                      # 💡 在脚本中直接使用 $UE4_ROOT 变量
                       echo "=== 正在抹除 C# 脚本中的 Windows 专属忽略警告参数 (/wd4103) ==="
                       find $UE4_ROOT/Engine/Source/Programs/UnrealBuildTool -type f -name "*.cs" -exec sed -i 's#-wd4103##g' {} +
                       find $UE4_ROOT/Engine/Source/Programs/UnrealBuildTool -type f -name "*.cs" -exec sed -i 's#/wd4103##g' {} +
                        
                       find ${{ github.workspace }} -type f -name "*.cs" -exec sed -i 's#-wd4103##g' {} +
                       find ${{ github.workspace }} -type f -name "*.cs" -exec sed -i 's#/wd4103##g' {} +

                       echo "=== 正在强制重新编译虚幻引擎构建工具 (UBT) ==="
                       rm -f $UE4_ROOT/Engine/Binaries/DotNET/UnrealBuildTool.exe
                       cd $UE4_ROOT
                       ./GenerateProjectFiles.sh

                       echo "=== 正在物理清空被污染的 Intermediate 缓存 ==="
                       rm -rf $UE4_ROOT/Engine/Intermediate/Build/Linux/B4D820EA
                       rm -rf ${{ github.workspace }}/Unreal/CarlaUE4/Intermediate
                    shell: bash

                  # - name: CarlaUE4Editor
                  #   run: |
                  #      source ./setEnv64.sh 
                  #      make CarlaUE4Editor ARGS="--chrono -j$(( $(nproc) / 3 ))"
                  #   shell: bash

