name: hutb Linux CI/CD

# 用法：GitHub 仓库 → Actions → 左侧 “hutb Linux CI/CD” → Run workflow
on:
  workflow_dispatch:
    inputs:
      python_version:
        description: "只构建一个 Python 版本的 wheel（3.10 = 服务器 venv-carla）"
        required: false
        default: "3.10"

concurrency:
  group: hutb-linux-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # 服务器上已注册的 self-hosted runner 标签（服务名 actions.runner.heshuyun9-hutb.yxkj-hutb-ci）
    runs-on: [self-hosted, linux, yxkj-hutb]
    timeout-minutes: 720

    env:
      UE4_ROOT: /home/yxkj/UnrealEngine_4.26
      # GitHub 走本地 FastGithub 代理（大仓库直连会 curl 28 超时）
      http_proxy: http://127.0.0.1:38457
      https_proxy: http://127.0.0.1:38457
      # 但 pip / pypi 必须直连：FastGithub 只转发 GitHub，走代理会 404/403
      no_proxy: localhost,127.0.0.1,pypi.org,files.pythonhosted.org,mirrors.aliyun.com
      PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple
      PIP_TRUSTED_HOST: mirrors.aliyun.com
      PIP_DEFAULT_TIMEOUT: "120"
      # wheel 链接改用系统 clang++（UE4 自带的旧 ld 读不了新版 glibc 的 .relr.dyn）
      LDSHARED: "/usr/bin/clang++ -shared"
      LDCXXSHARED: "/usr/bin/clang++ -shared"
      # UE4 自带 Mono 目录不完整（缺 bin），强制用系统 mono，否则 RunUAT 报 AutomationTool failed to compile
      UE_USE_SYSTEM_MONO: "1"
      # 安装前缀必须显式导出，否则 osm2odr 装到 /usr/local 无权限
      LIBCARLA_INSTALL_SERVER_FOLDER: ${{ github.workspace }}/Unreal/CarlaUE4/Plugins/Carla/CarlaDependencies
      LIBCARLA_INSTALL_CLIENT_FOLDER: ${{ github.workspace }}/PythonAPI/carla/dependencies

    steps:
      # ------------------------------------------------------------------
      - name: 0. 环境自检
        run: |
          set -x
          uname -a
          nproc; free -g | head -2; df -h "$GITHUB_WORKSPACE" | tail -1
          test -d "$UE4_ROOT/Engine" || { echo "UE4_ROOT 不存在: $UE4_ROOT"; exit 1; }
          ls "$UE4_ROOT/Engine/Binaries/Linux/UE4Editor" >/dev/null
          nvidia-smi --query-gpu=name,memory.total --format=csv || true
          mono --version | head -1
          /usr/bin/clang++ --version | head -1
          # 清掉上次构建残留的锁
          rm -rf /tmp/hutb-*.lock 2>/dev/null || true

      # ------------------------------------------------------------------
      - name: 1. 检出代码
        uses: actions/checkout@v4
        with:
          clean: false        # 保留 Build/ 里的依赖缓存，否则每次全量重编（数小时）
          fetch-depth: 0
          lfs: true
          submodules: false

      # ------------------------------------------------------------------
      - name: 2. 复用已有依赖与 Content（软链，避免每次下载几十 G）
        run: |
          set -e
          mkdir -p Build
          # 依赖缓存：优先复用服务器上已装好的 dependencies
          # 依赖缓存：统一指向 ~/hutb/Build/dependencies（miniconda 等已按 yxkj 用户路径装好；
          # 工作区里若残留别人建的 dependencies，其 miniconda 路径是 /home/ubuntu，必然 Permission denied）
          if [ -L Build/dependencies ] || [ ! -e Build/dependencies ]; then
            ln -sfn /home/yxkj/hutb/Build/dependencies Build/dependencies
            echo "依赖软链 -> /home/yxkj/hutb/Build/dependencies"
          else
            mv Build/dependencies "Build/dependencies.bak_$(date +%s)" 2>/dev/null || true
            ln -sfn /home/yxkj/hutb/Build/dependencies Build/dependencies
            echo "替换掉旧 dependencies 目录为软链"
          fi
          # Content（地图资源仓库）软链
          if [ -d /home/yxkj/ci-assets/Content ] && [ ! -e Unreal/CarlaUE4/Content ]; then
            ln -sfn /home/yxkj/ci-assets/Content Unreal/CarlaUE4/Content
            echo "复用 /home/yxkj/ci-assets/Content"
          fi
          ls -l Build | head
          du -sh Build 2>/dev/null || true

      # ------------------------------------------------------------------
      - name: 3. 工具链 shim（把本机验证过的补丁在 CI 里重建）
        run: |
          set -e
          UE4_BIN="$UE4_ROOT/Engine/Extras/ThirdPartyNotUE/SDKs/HostLinux/Linux_x64/v17_clang-10.0.1-centos7/x86_64-unknown-linux-gnu/bin"

          # 3.1 编译器包装：过滤 Python3.10 sysconfig 带来的、clang10 不认识的参数
          cat > /tmp/hutb-clang-wrap.sh <<EOF
          #!/bin/bash
          REAL="$UE4_BIN/clang"
          args=()
          for a in "\$@"; do
            case "\$a" in
              -fstack-clash-protection) ;;
              -mno-omit-leaf-frame-pointer) ;;
              *) args+=("\$a") ;;
            esac
          done
          exec "\$REAL" "\${args[@]}"
          EOF
          cat > /tmp/hutb-clangxx-wrap.sh <<EOF
          #!/bin/bash
          REAL="$UE4_BIN/clang++"
          args=()
          for a in "\$@"; do
            case "\$a" in
              -fstack-clash-protection) ;;
              -mno-omit-leaf-frame-pointer) ;;
              *) args+=("\$a");;
            esac
          done
          exec "\$REAL" "\${args[@]}"
          EOF
          chmod +x /tmp/hutb-clang-wrap.sh /tmp/hutb-clangxx-wrap.sh

          # 3.2 BuildPythonAPI.sh：CC/CXX 指向包装
          API_SH=Util/BuildTools/BuildPythonAPI.sh
          grep -q 'hutb-clang-wrap' "$API_SH" || \
            sed -i 's|^export CC=.*|export CC="/tmp/hutb-clang-wrap.sh"|; s|^export CXX=.*|export CXX="/tmp/hutb-clangxx-wrap.sh"|' "$API_SH"
          grep -n 'export CC=\|export CXX=' "$API_SH" | head -2

          # 3.3 BuildUE4Plugins.sh：Content 已存在但不是独立 git 仓库时，不能再 git reset
          P_SH=Util/BuildTools/BuildUE4Plugins.sh
          python3 - "$P_SH" <<'PY'
          import io, sys
          p = sys.argv[1]
          lines = io.open(p, encoding='utf-8').read().split('\n')
          if any('已存在但无 .git' in l for l in lines):
              print('Content 保护已存在，跳过')
          else:
              out, i, patched = [], 0, False
              while i < len(lines):
                  out.append(lines[i])
                  if 'Content directory already exists' in lines[i]:
                      j, block = i + 1, []
                      while j < len(lines) and lines[j].strip() and (
                              lines[j].strip().startswith('cd ') or
                              lines[j].strip().startswith('git ')):
                          block.append(lines[j]); j += 1
                      if block:
                          out.append(' if [ -d "$CONTENT_PATH/.git" ]; then')
                          out.extend(block)
                          out.append(' else')
                          out.append('   echo "  [hutb-ci] Content 已存在但无 .git，跳过 git 拉取"')
                          out.append(' fi')
                          patched = True
                          i = j
                          continue
                  i += 1
              io.open(p, 'w', encoding='utf-8').write('\n'.join(out))
              print('Content 保护插入成功' if patched else '警告：未找到 Content 分支，未打补丁')
          PY
          # 3.4 AirSim：reset 之后、build.sh 之前禁用 MavLinkTest
          # （g++7.5 没有 <filesystem>，MavLinkTest 会 fatal error）
          python3 - "$P_SH" <<'PY'
          import io, sys
          p = sys.argv[1]
          s = io.open(p, encoding='utf-8').read()
          if '[hutb-ci] MavLinkTest' in s:
              print('MavLinkTest 禁用已存在，跳过')
          else:
              inject = ('sed -i \'s|^add_subdirectory("MavLinkTest")|# [hutb-ci] MavLinkTest 已禁用|\' '
                        '"$AIR_BUILD_PATH/cmake/MavLinkCom/CMakeLists.txt" || true\n    ./build.sh')
              if './build.sh' in s:
                  s = s.replace('./build.sh', inject, 1)
                  io.open(p, 'w', encoding='utf-8').write(s)
                  print('MavLinkTest 禁用已注入')
              else:
                  print('警告：未找到 ./build.sh 锚点')
          PY

          # 3.5 Setup.sh：把被注释掉的 libc++ 三件套打开并指向 UE4 自带 LibCxx + sysroot
          # （仓库里这三行被注释、随后又被 unset，导致生成的 CMake 工具链里 -isystem/-L 为空）
          python3 - Util/BuildTools/Setup.sh <<'PY'
          import io, sys
          p = sys.argv[1]
          s = io.open(p, encoding='utf-8').read()
          inc = ('# [hutb-ci] libc++ 指向 UE4\n'
                 'export LLVM_INCLUDE="${UE4_ROOT}/Engine/Source/ThirdParty/Linux/LibCxx/include/c++/v1"\n'
                 'export LLVM_LIBPATH="${UE4_ROOT}/Engine/Source/ThirdParty/Linux/LibCxx/lib/Linux/x86_64-unknown-linux-gnu"\n'
                 'export UNREAL_HOSTED_CFLAGS="--sysroot=${UE4_ROOT}/Engine/Extras/ThirdPartyNotUE/SDKs/HostLinux/Linux_x64/v17_clang-10.0.1-centos7/x86_64-unknown-linux-gnu"')
          changed = False
          for key in ('UNREAL_HOSTED_CFLAGS', 'LLVM_INCLUDE', 'LLVM_LIBPATH'):
              if ('unset ' + key) in s:
                  s = s.replace('unset ' + key, inc if key == 'UNREAL_HOSTED_CFLAGS' else '# [hutb-ci] ' + key, 1)
                  changed = True
          if changed:
              io.open(p, 'w', encoding='utf-8').write(s)
              print('Setup.sh libc++/sysroot 已就绪')
          else:
              print('libc++/sysroot 已就绪，跳过')
          PY

          # 3.6 LibCarla 单测关掉：预编译的 gtest 依赖新版 glibc（__isoc23_strtol），
          # 与 UE4 sysroot(CentOS7 glibc 2.17) 链接必然失败；CI 不需要跑单测
          sed -i 's/-DLIBCARLA_BUILD_TEST=ON/-DLIBCARLA_BUILD_TEST=OFF/' Util/BuildTools/BuildLibCarla.sh || true
          # 双保险：直接让 LibCarla 的 CMake 永不加入 test 子目录
          sed -i 's/^if ((LIBCARLA_BUILD_TEST)/if (FALSE AND (LIBCARLA_BUILD_TEST)/' LibCarla/cmake/CMakeLists.txt || true

          # 3.7 用本机已调通的 BuildOSM2ODR.sh（UE4 clang + UE4 LibCxx + sysroot）
          if [ -f /home/yxkj/hutb/Util/BuildTools/BuildOSM2ODR.sh ]; then
            cp /home/yxkj/hutb/Util/BuildTools/BuildOSM2ODR.sh Util/BuildTools/BuildOSM2ODR.sh
            echo "已复用本机验证过的 BuildOSM2ODR.sh"
          fi

          # 3.8 仓库里写死了别人的 UE4 路径 /home/ubuntu/UnrealEngine_4.26，替换成本机的
          grep -rl /home/ubuntu/UnrealEngine_4.26 --include=*.sh . 2>/dev/null | while read -r f; do
            sed -i 's|/home/ubuntu/UnrealEngine_4.26|/home/yxkj/UnrealEngine_4.26|g' "$f"
          done

          # 3.9 Target.cs 里的 /wd4103 是 MSVC 专用参数，Linux clang 会把它拼到 -MF 后面
          #     变成 ".../xxx.cpp.d/wd4103" 从而报 "No such file or directory"
          for f in Unreal/CarlaUE4/Source/CarlaUE4.Target.cs Unreal/CarlaUE4/Source/CarlaUE4Editor.Target.cs; do
            [ -f "$f" ] && sed -i 's|^\(\s*\)AdditionalCompilerArguments = "/wd4103";|\1AdditionalCompilerArguments = "";|' "$f"
            [ -f "$f" ] && grep -n 'AdditionalCompilerArguments' "$f"
          done

          # 3.10 AirSim 的 setup.sh 把 CC/CXX 写死成 /usr/bin/gcc(g++)，导致 libAirLib.a
          #      用 libstdc++(std::__cxx11) 编出来，与插件本体 libc++(std::__1) ABI 不兼容。
          #      在 BuildUE4Plugins.sh 里调用 setup.sh 的那一行之前，插入工具链改写 + gitlab 绕过代理。
          python3 - Util/BuildTools/BuildUE4Plugins.sh <<'PY'
          import io
          p = 'Util/BuildTools/BuildUE4Plugins.sh'
          lines = io.open(p, encoding='utf-8').read().split('\n')
          if any('hutb-ci airsim toolchain' in l for l in lines):
              print('AirSim 工具链补丁已存在，跳过')
          else:
              idx = next((i for i, l in enumerate(lines)
                          if 'HTTP_PROXY' in l and './setup.sh' in l), None)
              if idx is None:
                  print('警告：未找到 setup.sh 调用行')
              else:
                  block = [
                      '    # [hutb-ci airsim toolchain] AirSim 默认用 g++/libstdc++，与 UE4 插件 libc++ 的 ABI 不兼容',
                      '    UE4_BIN=/home/yxkj/UnrealEngine_4.26/Engine/Extras/ThirdPartyNotUE/SDKs/HostLinux/Linux_x64/v17_clang-10.0.1-centos7/x86_64-unknown-linux-gnu/bin',
                      '    UE4_INC=/home/yxkj/UnrealEngine_4.26/Engine/Source/ThirdParty/Linux/LibCxx/include/c++/v1',
                      '    UE4_LIB=/home/yxkj/UnrealEngine_4.26/Engine/Source/ThirdParty/Linux/LibCxx/lib/Linux/x86_64-unknown-linux-gnu',
                      '    UE4_SDK=/home/yxkj/UnrealEngine_4.26/Engine/Extras/ThirdPartyNotUE/SDKs/HostLinux/Linux_x64/v17_clang-10.0.1-centos7/x86_64-unknown-linux-gnu',
                      '    sed -i -e "s|^export CC=.*|export CC=\\"$UE4_BIN/clang\\"|" -e "s|^export CXX=.*|export CXX=\\"$UE4_BIN/clang++\\"|" setup.sh build.sh',
                      '    export CFLAGS="-stdlib=libc++ -isystem $UE4_INC --sysroot=$UE4_SDK"',
                      '    export CXXFLAGS="-stdlib=libc++ -isystem $UE4_INC --sysroot=$UE4_SDK"',
                      '    export LDFLAGS="-stdlib=libc++ -L$UE4_LIB --sysroot=$UE4_SDK"',
                      '    # eigen/rpclib 从 gitlab 下载，FastGithub 代理会返回 404，必须直连',
                      '    export no_proxy="gitlab.com,${no_proxy}" NO_PROXY="gitlab.com,${NO_PROXY}"',
                  ]
                  lines[idx:idx] = block
                  io.open(p, 'w', encoding='utf-8').write('\n'.join(lines))
                  print('AirSim 工具链补丁已注入（第 %d 行前）' % (idx + 1))
          PY

          echo "shim 就绪"

      # ------------------------------------------------------------------
      - name: 4. setup（下载依赖 + 生成 CMake 配置）
        run: |
          set -o pipefail
          # 清掉旧的 AirSim 构建缓存，强制用 Step 3.10 打补丁后的工具链重编 AirLib
          rm -rf Build/AirSim
          make setup 2>&1 | tee /tmp/ci_setup.log

      # ------------------------------------------------------------------
      # 5. UE4 插件（AirSim/StreetMap 等）
      # 说明：make setup 已依赖 downloadplugins 并完成插件构建，这里不再重复执行
      # （仓库里的 Plugins.sh 有 bug：未 source Environment.sh，log 未定义，直接跑必失败）

      # ------------------------------------------------------------------
      - name: 6. 同步资源 Update.sh
        run: |
          set -o pipefail
          if [ -x Update.sh ]; then ./Update.sh 2>&1 | tee /tmp/ci_update.log; else echo "无 Update.sh，跳过"; fi

      # ------------------------------------------------------------------
      # LibCarla 无需单独编：CarlaUE4Editor 依赖 LibCarla.server.release，
      # PythonAPI.wheel 依赖 LibCarla.client.release，make 会自动带出来。
      - name: 7. 编译 CarlaUE4Editor
        run: |
          set -o pipefail
          # osm2odr 需要 zlib 头；用了 UE4 sysroot 后系统 /usr/include 不可见，单独拷一份用 CPATH 注入
          mkdir -p Build/zlib-include
          cp -f /usr/include/zlib.h /usr/include/zconf.h Build/zlib-include/ 2>/dev/null || true
          export CPATH="$PWD/Build/zlib-include${CPATH:+:$CPATH}"
          # 清掉旧配置（CMAKE_CXX_FLAGS 会随 setup 重跑不断叠加，导致参数重复十几份）
          rm -rf Build/LibCarla Build/LibCppToolChain.cmake
          # 不再拷贝本机 libAirLib.a：Step 4 已用 UE4 clang + libc++ 编出 ABI 一致的版本
          ls -l Unreal/CarlaUE4/Plugins/AirSim/Source/AirLib/lib/libAirLib.a || true
          make CarlaUE4Editor 2>&1 | tee /tmp/ci_editor.log

      # ------------------------------------------------------------------
      - name: 8. 构建 PythonAPI wheel（只做指定版本，默认 8 个版本太慢）
        run: |
          set -o pipefail
          make PythonAPI.wheel ARGS="--python-version=${{ inputs.python_version }}" 2>&1 | tee /tmp/ci_wheel.log
          ls -lh PythonAPI/carla/dist/

      # ------------------------------------------------------------------
      - name: 9. 打包（Shipping + Cook）
        run: |
          set -o pipefail
          bash Util/BuildTools/Package.sh 2>&1 | tee /tmp/ci_package.log

      # ------------------------------------------------------------------
      - name: 10. 汇总产物
        if: always()
        run: |
          echo "==== 产物目录 ===="
          ls -lh Build/UE4Carla/ | tail -5 || true
          echo "==== wheel ===="
          ls -lh PythonAPI/carla/dist/ || true
          echo "==== 磁盘 ===="
          df -h "$GITHUB_WORKSPACE" | tail -1

