name: hutb Linux CI/CD

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: hutb-linux-ci-${{ github.ref }}
  cancel-in-progress: false

env:
  PROXY: "http://127.0.0.1:38457"
  SHIM: "/home/yxkj/ci-shims"

jobs:
  build:
    name: Build hutb (self-hosted GPU server)
    runs-on: [self-hosted, yxkj-hutb]
    timeout-minutes: 600
    defaults:
      run:
        shell: bash

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          clean: false

      - name: 2. Show files
        run: |
          set -x
          pwd
          ls -la
          nproc
          df -h . | tail -1

      - name: 3. Reuse local assets (dependencies / Content)
        run: |
          set -x
          if [ ! -d Build/dependencies ]; then
            mkdir -p Build
            cp -a /home/yxkj/ci-assets/dependencies Build/dependencies
          fi
          if [ ! -e Unreal/CarlaUE4/Content ] || [ -z "$(ls -A Unreal/CarlaUE4/Content 2>/dev/null)" ]; then
            rm -rf Unreal/CarlaUE4/Content
            ln -s /home/yxkj/hutb/Unreal/CarlaUE4/Content Unreal/CarlaUE4/Content
          fi
          du -sh Build/dependencies 2>/dev/null || true
          ls Unreal/CarlaUE4/Content | head -5

      - name: 4. Ensure origin/master refs
        run: |
          set -x
          for g in $(find . -maxdepth 4 -type d -name .git -prune -print | sed 's#/.git$##'); do
            git -C "$g" fetch origin master:refs/remotes/origin/master --depth=1 2>/dev/null || true
            git -C "$g" show-ref --verify --quiet refs/remotes/origin/master || git -C "$g" update-ref refs/remotes/origin/master HEAD
          done

      - name: 5. Patch origin/master references
        run: |
          set -x
          FILES=$(grep -rln "origin/master" Util Unreal --include="*.sh" --include="*.mk" --include="Makefile" 2>/dev/null || true)
          for f in $FILES; do sed -i 's#origin/master#HEAD#g' "$f"; done
          echo "$FILES"

      - name: 6. Toolchain shims (<filesystem> / -stdlib / -lstdc++fs / proxy)
        run: |
          set -ex
          mkdir -p "$SHIM/include" "$SHIM/bin"

          # 6.1 <filesystem> 兼容头：GCC7 这一代 libstdc++ 只有 <experimental/filesystem>
          cat > "$SHIM/include/filesystem" <<'HDR'
          #pragma once
          #if defined(__GNUC__) && __GNUC__ < 8
          #include <experimental/filesystem>
          namespace std { namespace filesystem = experimental::filesystem; }
          #else
          #include_next <filesystem>
          #endif
          HDR

          # 6.2 编译器包装：链接命令末尾自动补 -lstdc++fs（顺序正确）
          for name in cc gcc g++ c++ clang clang++; do
            REAL=$(command -v "$name" 2>/dev/null || true)
            [ -z "$REAL" ] && continue
            case "$REAL" in *ci-shims*) continue;; esac
            if [ "$name" = "clang++" ]; then
              printf '#!/bin/bash\nexec "%s" -stdlib=libstdc++ "$@" -lstdc++fs\n' "$REAL" > "$SHIM/bin/$name"
            else
              printf '#!/bin/bash\nexec "%s" "$@" -lstdc++fs\n' "$REAL" > "$SHIM/bin/$name"
            fi
            chmod +x "$SHIM/bin/$name"
          done
          ls -la "$SHIM/bin"

          # 6.3 给所有 CMakeLists.txt 注入 link_libraries(stdc++fs)
          cat > "$SHIM/patch_stdcxxfs.sh" <<'PATCH'
          #!/bin/bash
          # 注入 link_libraries(stdc++fs)：让 -lstdc++fs 出现在“库的位置”（目标文件之后）
          set -u
          ROOT="${1:-.}"
          FILES=$(grep -rl --include=CMakeLists.txt -E 'cmake_minimum_required|project[[:space:]]*\(' "$ROOT" 2>/dev/null \
                  | grep -vE '/(\.git|dependencies|Content)/|/build_(release|debug)/' || true)
          n=0
          for f in $FILES; do
            grep -q 'stdc++fs' "$f" && continue
            if grep -qE '^[[:space:]]*cmake_minimum_required' "$f"; then
              sed -i '0,/^[[:space:]]*cmake_minimum_required/s//&\nlink_libraries(stdc++fs)/' "$f"
            elif grep -qE '^[[:space:]]*project[[:space:]]*\(' "$f"; then
              sed -i '0,/^[[:space:]]*project[[:space:]]*(/s//&\nlink_libraries(stdc++fs)/' "$f"
            else
              continue
            fi
            echo "  patched: $f"
            n=$((n+1))
          done
          echo "=== link_libraries(stdc++fs) patched: $n file(s) ==="
          PATCH
          chmod +x "$SHIM/patch_stdcxxfs.sh"

          # 6.4 环境变量必须写 GITHUB_ENV 才能跨步骤生效
          STD=""
          if command -v clang++ >/dev/null 2>&1; then
            STD="-stdlib=libstdc++"
          fi
          {
            echo "CPLUS_INCLUDE_PATH=$SHIM/include"
            echo "C_INCLUDE_PATH=$SHIM/include"
            echo "CXXFLAGS=-I$SHIM/include $STD"
            echo "CFLAGS=-I$SHIM/include"
            echo "LDFLAGS=-lstdc++fs"
            echo "http_proxy=$PROXY"
            echo "https_proxy=$PROXY"
            echo "no_proxy=localhost,127.0.0.1"
          } >> "$GITHUB_ENV"
          echo "$SHIM/bin" >> "$GITHUB_PATH"

          echo "=== 代理连通性测试 ==="
          curl -sI --max-time 20 -x "$PROXY" https://github.com | head -1 || echo "代理不可用"

      - name: 7. setup (依赖 + 配置)
        run: |
          set -x
          export http_proxy="$PROXY" https_proxy="$PROXY" no_proxy=localhost,127.0.0.1
          if [ -f ./setEnv64.sh ]; then source ./setEnv64.sh; fi
          rm -rf Build/*-source Build/*-src
          ./setup.sh
          make setup ARGS="--chrono"
          bash "$SHIM/patch_stdcxxfs.sh" .

      - name: 8. build (AirSim/AirLib + 插件)
        run: |
          set -x
          export http_proxy="$PROXY" https_proxy="$PROXY" no_proxy=localhost,127.0.0.1
          if [ -f ./setEnv64.sh ]; then source ./setEnv64.sh; fi
          bash "$SHIM/patch_stdcxxfs.sh" .
          make plugins

      - name: 9. retrieve content
        run: |
          set -x
          export http_proxy="$PROXY" https_proxy="$PROXY" no_proxy=localhost,127.0.0.1
          if [ -f ./setEnv64.sh ]; then source ./setEnv64.sh; fi
          source ./Update.sh

      # ---- 下面三步先留着，等 7/8/9 全绿再放开 ----
      # - name: 10. CarlaUE4Editor
      #   run: |
      #     source ./setEnv64.sh
      #     make CarlaUE4Editor
