name: hutb CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: hutb-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Compile check
    runs-on: [self-hosted, yxkj-hutb]
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          clean: false

      - name: 复用本地资产
        run: |
          set -e
          [ -d Build/dependencies ] || { mkdir -p Build; cp -a ~/ci-assets/dependencies Build/dependencies; }
          [ -s Unreal/CarlaUE4/Content ] 2>/dev/null || {
            rm -rf Unreal/CarlaUE4/Content
            ln -s ~/hutb/Unreal/CarlaUE4/Content Unreal/CarlaUE4/Content
          }
          df -h . | tail -1

      - name: 环境
        run: |
          set -e
          echo "UE4_ROOT=$HOME/UnrealEngine_4.26" >> $GITHUB_ENV
          echo "DISPLAY=:1" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=$PWD/Unreal/CarlaUE4/Plugins/UnrealRoboticsLab/Binaries/Linux:$LD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: 编译（唯一目标：过不过）
        run: |
          set -e
          make CarlaUE4Editor 2>&1 | tail -60

      - name: 结果
        if: always()
        run: |
          ls -lh Unreal/CarlaUE4/Binaries/Linux/ | head -20
