name: hutb Linux CI/CD

# 用法：GitHub 仓库 → Actions → 左侧 “hutb Linux CI/CD” → Run workflow
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "fast=复用依赖增量构建（默认）；full=清理后全量重建，再跑全部 check"
        type: choice
        options: [fast, full]
        default: fast
      upload:
        description: "全部 check 通过后，是否上传发行包到腾讯工蜂大文件仓库"
        type: choice
        options: ["false", "true"]
        default: "false"
      python_version:
        description: "只构建一个 Python 版本的 wheel / 只测这个版本（3.10 = 服务器 venv-carla）"
        required: false
        default: "3.10"
      refresh_content:
        description: "是否重新下载 88G 地图资源（Content），默认复用缓存；发版前可打开验证下载链路"
        type: choice
        options: ["false", "true"]
        default: "false"
  schedule:
    # 每周全量重建一次：每周一 02:00（北京时间）= 周日 18:00 UTC
    - cron: '0 18 * * 0'

concurrency:
  group: hutb-linux-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # 服务器上已注册的 self-hosted runner 标签（服务名 actions.runner.heshuyun9-hutb.yxkj-hutb-ci）
    runs-on: [self-hosted, linux, yxkj-hutb]
    # 全量模式（重装 UE4 中间产物 + 重下依赖 + 打包 + 全部 check）耗时远超 12 小时，与上游一致给 24 小时
    timeout-minutes: 1440

    env:
      # fast=复用依赖增量构建；full=UE4/依赖从零重建（每周定时任务自动走 full）
      MODE: ${{ github.event_name == 'schedule' && 'full' || inputs.mode }}
      # 是否上传发行包到腾讯工蜂，默认关；只有全部 check 通过后才手动打开
      UPLOAD: ${{ inputs.upload || 'false' }}
      # 本次只构建/只测试的 Python 版本（上游默认 3.7~3.14 全跑）
      PY_VER: ${{ inputs.python_version || '3.10' }}
      # 是否重下 88G 地图资源；默认复用 ci-assets 缓存
      REFRESH_CONTENT: ${{ inputs.refresh_content || 'false' }}
      UE4_ROOT: /home/yxkj/UnrealEngine_4.26
      # GitHub 走本地 FastGithub 代理（大仓库直连会 curl 28 超时）
      http_proxy: http://127.0.0.1:38457
      https_proxy: http://127.0.0.1:38457
      # 但 pip / pypi 必须直连：FastGithub 只转发 GitHub，走代理会 404/403
      no_proxy: localhost,127.0.0.1,pypi.org,files.pythonhosted.org,mirrors.aliyun.com
      PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple
      PIP_TRUSTED_HOST: mirrors.aliyun.com
      PIP_DEFAULT_TIMEOUT: "120"
      # wheel 链接改用系统 clang++（UE4 自带的旧 ld 读不了新版 glibc 的 .relr.dyn）
      LDSHARED: "/usr/bin/clang++ -shared"
      LDCXXSHARED: "/usr/bin/clang++ -shared"
      # UE4 自带 Mono 目录不完整（缺 bin），强制用系统 mono，否则 RunUAT 报 AutomationTool failed to compile
      UE_USE_SYSTEM_MONO: "1"
      # 安装前缀必须显式导出，否则 osm2odr 装到 /usr/local 无权限
      LIBCARLA_INSTALL_SERVER_FOLDER: ${{ github.workspace }}/Unreal/CarlaUE4/Plugins/Carla/CarlaDependencies
      LIBCARLA_INSTALL_CLIENT_FOLDER: ${{ github.workspace }}/PythonAPI/carla/dependencies
      # Content 用 ci-assets 里的共享缓存，跳过对腾讯私有仓库的 git pull（匿名 404）
      HUTB_CONTENT_CACHE: "1"

    steps:
      # ------------------------------------------------------------------
      - name: 0. 环境自检
        run: |
          set -x
          uname -a
          nproc; free -g | head -2; df -h "$GITHUB_WORKSPACE" | tail -1
          test -d "$UE4_ROOT/Engine" || { echo "UE4_ROOT 不存在: $UE4_ROOT"; exit 1; }
          ls "$UE4_ROOT/Engine/Binaries/Linux/UE4Editor" >/dev/null
          nvidia-smi --query-gpu=name,memory.total --format=csv || true
          mono --version | head -1
          /usr/bin/clang++ --version | head -1
          echo "MODE=$MODE UPLOAD=$UPLOAD PY_VER=$PY_VER"
          # 清掉上次构建残留的锁
          rm -rf /tmp/hutb-*.lock 2>/dev/null || true

      # ------------------------------------------------------------------
      - name: 1. 检出代码
        uses: actions/checkout@v4
        with:
          clean: false        # 保留 Build/ 里的依赖缓存，否则每次全量重编（数小时）
          fetch-depth: 0
          lfs: true
          submodules: false

      # ------------------------------------------------------------------
      - name: 2. 依赖与 Content 缓存策略（fast 复用 / full 重下）
        run: |
          set -e
          mkdir -p Build
          CI_CONTENT=/home/yxkj/ci-assets/Content

          # 地图资源：full 模式默认重下（真全量）；fast 想重下把 refresh_content 选 true
          if [ "$MODE" = "full" ] || [ "$REFRESH_CONTENT" = "true" ]; then
            echo "[content] 删除旧资源，重新 clone + git lfs pull（约 88G）"
            rm -rf "$CI_CONTENT"
            mkdir -p /home/yxkj/ci-assets
            (
              # 腾讯工蜂直连，不能走 FastGithub 代理
              unset http_proxy https_proxy HTTP_PROXY HTTPS_PROXY
              git clone --depth 1 \
                "https://OpenHUTB:T8w6TYB_r71gGTP3A02B@git.code.tencent.com/OpenHUTB/Content.git" \
                "$CI_CONTENT"
              cd "$CI_CONTENT"
              git lfs pull || echo "[content] lfs pull 有报错，交给下面的完整性检查判定"
            )
            # Update.sh 靠 Content/Carla/.git 判断是否需要从 S3 重下，补一个标记
            mkdir -p "$CI_CONTENT/Carla/.git"
          fi

          if [ "$MODE" = "full" ]; then
            # 全量：不复用依赖缓存，交给 Step 4 的 ./setup.sh 从零下载安装
            rm -rf Build/dependencies
            echo "[full] 已删除工作区 dependencies，setup.sh 将从零下载"
          else
            # 依赖缓存：统一指向 ~/hutb/Build/dependencies（miniconda 等已按 yxkj 用户路径装好；
            # 工作区里若残留别人建的 dependencies，其 miniconda 路径是 /home/ubuntu，必然 Permission denied）
            if [ -L Build/dependencies ] || [ ! -e Build/dependencies ]; then
              ln -sfn /home/yxkj/hutb/Build/dependencies Build/dependencies
              echo "依赖软链 -> /home/yxkj/hutb/Build/dependencies"
            else
              mv Build/dependencies "Build/dependencies.bak_$(date +%s)" 2>/dev/null || true
              ln -sfn /home/yxkj/hutb/Build/dependencies Build/dependencies
              echo "替换掉旧 dependencies 目录为软链"
            fi
          fi
          # Content 指向 ci-assets 里的完整版
          if [ "$(readlink -f Unreal/CarlaUE4/Content 2>/dev/null)" != "$CI_CONTENT" ]; then
            if [ -L Unreal/CarlaUE4/Content ]; then
              rm -f Unreal/CarlaUE4/Content
            elif [ -e Unreal/CarlaUE4/Content ]; then
              mv Unreal/CarlaUE4/Content "Unreal/CarlaUE4/Content.bak_$(date +%s)" || true
            fi
            ln -sfn "$CI_CONTENT" Unreal/CarlaUE4/Content
            echo "Content 已指向: $CI_CONTENT"
          fi

          # 资源完整性体检：fast 防止缓存损坏；full 防止"下载了但没拉全"
          test -d "$CI_CONTENT/.git" || { echo "Content 不是 git 仓库"; exit 1; }
          # 注意：这台机器的 du 不支持 -g，只能用 -m（MB）
          SIZE_MB=$(du -sm "$CI_CONTENT" 2>/dev/null | cut -f1)
          POINTER=$(grep -l "git-lfs.github.com/spec/v1" "$CI_CONTENT"/Carla/Maps/*.umap 2>/dev/null | wc -l | tr -d ' ')
          TOWN_SIZE=$(stat -c%s "$CI_CONTENT/Carla/Maps/Town10HD.umap" 2>/dev/null || echo 0)
          echo "[content] 大小 ${SIZE_MB:-未知}MB，LFS 指针 ${POINTER} 个，Town10HD ${TOWN_SIZE} 字节"
          [ "${SIZE_MB:-0}" -ge 60000 ] || { echo "Content 不完整：只有 ${SIZE_MB:-0}MB"; exit 1; }
          [ "$POINTER" -eq 0 ]          || { echo "$POINTER 个地图还是 LFS 指针，未拉取实体文件"; exit 1; }
          [ "$TOWN_SIZE" -ge 1000000 ]  || { echo "Town10HD.umap 异常：${TOWN_SIZE} 字节"; exit 1; }

          ls -l Build | head
          du -sh Build 2>/dev/null || true

      # ------------------------------------------------------------------
      - name: 2b. 全量重建清理（仅 MODE=full）
        if: env.MODE == 'full'
        run: |
          set -e
          echo "[full] 清理构建产物、UE4 中间缓存与 PythonAPI 产物"
          rm -rf Build/AirSim Build/LibCarla Build/UE4Carla Build/*-source Build/*-src
          rm -f Build/LibCppToolChain.cmake
          rm -rf Unreal/CarlaUE4/Intermediate
          rm -rf PythonAPI/carla/build PythonAPI/carla/dist
          # 与上游 build_linux.yml 的 "Fix Windows Compiler Flags and Clean Cache" 一致：
          # 清掉被污染的引擎 Intermediate，并让 UBT 重新生成
          rm -rf "$UE4_ROOT/Engine/Intermediate/Build/Linux/B4D820EA"
          rm -f "$UE4_ROOT/Engine/Binaries/DotNET/UnrealBuildTool.exe"
          df -h "$GITHUB_WORKSPACE" | tail -1

      # ------------------------------------------------------------------
      - name: 3. 工具链 shim（把本机验证过的补丁在 CI 里重建）
        run: |
          set -e
          UE4_BIN="$UE4_ROOT/Engine/Extras/ThirdPartyNotUE/SDKs/HostLinux/Linux_x64/v17_clang-10.0.1-centos7/x86_64-unknown-linux-gnu/bin"

          # 3.1 编译器包装：过滤 Python3.10 sysconfig 带来的、clang10 不认识的参数
          cat > /tmp/hutb-clang-wrap.sh <<EOF
          #!/bin/bash
          REAL="$UE4_BIN/clang"
          args=()
          for a in "\$@"; do
            case "\$a" in
              -fstack-clash-protection) ;;
              -mno-omit-leaf-frame-pointer) ;;
              *) args+=("\$a") ;;
            esac
          done
          exec "\$REAL" "\${args[@]}"
          EOF
          cat > /tmp/hutb-clangxx-wrap.sh <<EOF
          #!/bin/bash
          REAL="$UE4_BIN/clang++"
          args=()
          for a in "\$@"; do
            case "\$a" in
              -fstack-clash-protection) ;;
              -mno-omit-leaf-frame-pointer) ;;
              *) args+=("\$a");;
            esac
          done
          exec "\$REAL" "\${args[@]}"
          EOF
          chmod +x /tmp/hutb-clang-wrap.sh /tmp/hutb-clangxx-wrap.sh

          # 3.2 BuildPythonAPI.sh：CC/CXX 指向包装
          API_SH=Util/BuildTools/BuildPythonAPI.sh
          grep -q 'hutb-clang-wrap' "$API_SH" || \
            sed -i 's|^export CC=.*|export CC="/tmp/hutb-clang-wrap.sh"|; s|^export CXX=.*|export CXX="/tmp/hutb-clangxx-wrap.sh"|' "$API_SH"
          grep -n 'export CC=\|export CXX=' "$API_SH" | head -2

          # 3.3 BuildUE4Plugins.sh：Content 已存在但不是独立 git 仓库时，不能再 git reset
          P_SH=Util/BuildTools/BuildUE4Plugins.sh
          python3 - "$P_SH" <<'PY'
          import io, sys
          p = sys.argv[1]
          lines = io.open(p, encoding='utf-8').read().split('\n')
          if any('已存在但无 .git' in l for l in lines):
              print('Content 保护已存在，跳过')
          else:
              out, i, patched = [], 0, False
              while i < len(lines):
                  out.append(lines[i])
                  if 'Content directory already exists' in lines[i]:
                      j, block = i + 1, []
                      while j < len(lines) and lines[j].strip() and (
                              lines[j].strip().startswith('cd ') or
                              lines[j].strip().startswith('git ')):
                          block.append(lines[j]); j += 1
                      if block:
                          out.append(' if [ "${HUTB_CONTENT_CACHE:-0}" = "1" ]; then')
                          out.append('   echo "  [hutb-ci] 使用共享 Content 缓存，跳过 git pull"')
                          out.append(' elif [ -d "$CONTENT_PATH/.git" ]; then')
                          out.extend(block)
                          out.append(' else')
                          out.append('   echo "  [hutb-ci] Content 已存在但无 .git，跳过 git 拉取"')
                          out.append(' fi')
                          patched = True
                          i = j
                          continue
                  i += 1
              io.open(p, 'w', encoding='utf-8').write('\n'.join(out))
              print('Content 保护插入成功' if patched else '警告：未找到 Content 分支，未打补丁')
          PY
          # 3.4 AirSim：reset 之后、build.sh 之前禁用 MavLinkTest
          # （g++7.5 没有 <filesystem>，MavLinkTest 会 fatal error）
          python3 - "$P_SH" <<'PY'
          import io, sys
          p = sys.argv[1]
          s = io.open(p, encoding='utf-8').read()
          if '[hutb-ci] MavLinkTest' in s:
              print('MavLinkTest 禁用已存在，跳过')
          else:
              inject = ('sed -i \'s|^add_subdirectory("MavLinkTest")|# [hutb-ci] MavLinkTest 已禁用|\' '
                        '"$AIR_BUILD_PATH/cmake/MavLinkCom/CMakeLists.txt" || true\n    ./build.sh')
              if './build.sh' in s:
                  s = s.replace('./build.sh', inject, 1)
                  io.open(p, 'w', encoding='utf-8').write(s)
                  print('MavLinkTest 禁用已注入')
              else:
                  print('警告：未找到 ./build.sh 锚点')
          PY

          # 3.5 Setup.sh：把被注释掉的 libc++ 三件套打开并指向 UE4 自带 LibCxx + sysroot
          # （仓库里这三行被注释、随后又被 unset，导致生成的 CMake 工具链里 -isystem/-L 为空）
          python3 - Util/BuildTools/Setup.sh <<'PY'
          import io, sys
          p = sys.argv[1]
          s = io.open(p, encoding='utf-8').read()
          inc = ('# [hutb-ci] libc++ 指向 UE4\n'
                 'export LLVM_INCLUDE="${UE4_ROOT}/Engine/Source/ThirdParty/Linux/LibCxx/include/c++/v1"\n'
                 'export LLVM_LIBPATH="${UE4_ROOT}/Engine/Source/ThirdParty/Linux/LibCxx/lib/Linux/x86_64-unknown-linux-gnu"\n'
                 'export UNREAL_HOSTED_CFLAGS="--sysroot=${UE4_ROOT}/Engine/Extras/ThirdPartyNotUE/SDKs/HostLinux/Linux_x64/v17_clang-10.0.1-centos7/x86_64-unknown-linux-gnu"')
          changed = False
          for key in ('UNREAL_HOSTED_CFLAGS', 'LLVM_INCLUDE', 'LLVM_LIBPATH'):
              if ('unset ' + key) in s:
                  s = s.replace('unset ' + key, inc if key == 'UNREAL_HOSTED_CFLAGS' else '# [hutb-ci] ' + key, 1)
                  changed = True
          if changed:
              io.open(p, 'w', encoding='utf-8').write(s)
              print('Setup.sh libc++/sysroot 已就绪')
          else:
              print('libc++/sysroot 已就绪，跳过')
          PY

          # 3.6 LibCarla 单测关掉：预编译的 gtest 依赖新版 glibc（__isoc23_strtol），
          # 与 UE4 sysroot(CentOS7 glibc 2.17) 链接必然失败；CI 不需要跑单测
          sed -i 's/-DLIBCARLA_BUILD_TEST=ON/-DLIBCARLA_BUILD_TEST=OFF/' Util/BuildTools/BuildLibCarla.sh || true
          # 双保险：直接让 LibCarla 的 CMake 永不加入 test 子目录
          sed -i 's/^if ((LIBCARLA_BUILD_TEST)/if (FALSE AND (LIBCARLA_BUILD_TEST)/' LibCarla/cmake/CMakeLists.txt || true

          # 3.7 用本机已调通的 BuildOSM2ODR.sh（UE4 clang + UE4 LibCxx + sysroot）
          if [ -f /home/yxkj/hutb/Util/BuildTools/BuildOSM2ODR.sh ]; then
            cp /home/yxkj/hutb/Util/BuildTools/BuildOSM2ODR.sh Util/BuildTools/BuildOSM2ODR.sh
            echo "已复用本机验证过的 BuildOSM2ODR.sh"
          fi

          # 3.8 仓库里写死了别人的 UE4 路径 /home/ubuntu/UnrealEngine_4.26，替换成本机的
          grep -rl /home/ubuntu/UnrealEngine_4.26 --include=*.sh . 2>/dev/null | while read -r f; do
            sed -i 's|/home/ubuntu/UnrealEngine_4.26|/home/yxkj/UnrealEngine_4.26|g' "$f"
          done

          # 3.9 Target.cs 里的 /wd4103 是 MSVC 专用参数，Linux clang 会把它拼到 -MF 后面
          #     变成 ".../xxx.cpp.d/wd4103" 从而报 "No such file or directory"
          for f in Unreal/CarlaUE4/Source/CarlaUE4.Target.cs Unreal/CarlaUE4/Source/CarlaUE4Editor.Target.cs; do
            [ -f "$f" ] && sed -i 's|^\(\s*\)AdditionalCompilerArguments = "/wd4103";|\1AdditionalCompilerArguments = "";|' "$f"
            [ -f "$f" ] && grep -n 'AdditionalCompilerArguments' "$f"
          done

          # 3.10 AirSim 的 setup.sh 把 CC/CXX 写死成 /usr/bin/gcc(g++)，导致 libAirLib.a
          #      用 libstdc++(std::__cxx11) 编出来，与插件本体 libc++(std::__1) ABI 不兼容。
          #      在 BuildUE4Plugins.sh 里调用 setup.sh 的那一行之前，插入工具链改写 + gitlab 绕过代理。
          python3 - Util/BuildTools/BuildUE4Plugins.sh <<'PY'
          import io
          p = 'Util/BuildTools/BuildUE4Plugins.sh'
          lines = io.open(p, encoding='utf-8').read().split('\n')
          if any('hutb-ci airsim toolchain' in l for l in lines):
              print('AirSim 工具链补丁已存在，跳过')
          else:
              idx = next((i for i, l in enumerate(lines)
                          if 'HTTP_PROXY' in l and './setup.sh' in l), None)
              if idx is None:
                  print('警告：未找到 setup.sh 调用行')
              else:
                  block = [
                      '    # [hutb-ci airsim toolchain] AirSim 默认用 g++/libstdc++，与 UE4 插件 libc++ 的 ABI 不兼容',
                      '    UE4_BIN=/home/yxkj/UnrealEngine_4.26/Engine/Extras/ThirdPartyNotUE/SDKs/HostLinux/Linux_x64/v17_clang-10.0.1-centos7/x86_64-unknown-linux-gnu/bin',
                      '    UE4_INC=/home/yxkj/UnrealEngine_4.26/Engine/Source/ThirdParty/Linux/LibCxx/include/c++/v1',
                      '    UE4_LIB=/home/yxkj/UnrealEngine_4.26/Engine/Source/ThirdParty/Linux/LibCxx/lib/Linux/x86_64-unknown-linux-gnu',
                      '    UE4_SDK=/home/yxkj/UnrealEngine_4.26/Engine/Extras/ThirdPartyNotUE/SDKs/HostLinux/Linux_x64/v17_clang-10.0.1-centos7/x86_64-unknown-linux-gnu',
                      '    sed -i -e "s|^export CC=.*|export CC=\\"$UE4_BIN/clang\\"|" -e "s|^export CXX=.*|export CXX=\\"$UE4_BIN/clang++\\"|" setup.sh',
                      '    # build.sh 里按 clang 版本分支写死了 gcc/g++，用不带行首锚点的 sed 全部替换',
                      '    sed -i "s|export CC=.*|export CC=\\"$UE4_BIN/clang\\"|g; s|export CXX=.*|export CXX=\\"$UE4_BIN/clang++\\"|g" build.sh',
                      '    export CFLAGS="-stdlib=libc++ -isystem $UE4_INC --sysroot=$UE4_SDK"',
                      '    export CXXFLAGS="-stdlib=libc++ -isystem $UE4_INC --sysroot=$UE4_SDK"',
                      '    export LDFLAGS="-stdlib=libc++ -L$UE4_LIB --sysroot=$UE4_SDK"',
                      '    # eigen/rpclib 从 gitlab 下载，FastGithub 代理会返回 404，必须直连',
                      '    export no_proxy="gitlab.com,${no_proxy}" NO_PROXY="gitlab.com,${NO_PROXY}"',
                  ]
                  lines[idx:idx] = block
                  # setup.sh 需要代理拉 GitHub（rpclib/msgpack），但 gitlab 必须直连
                  lines[idx + len(block)] = '    no_proxy="gitlab.com,${no_proxy}" NO_PROXY="gitlab.com,${NO_PROXY}" ./setup.sh'
                  io.open(p, 'w', encoding='utf-8').write('\n'.join(lines))
                  print('AirSim 工具链补丁已注入（第 %d 行前）' % (idx + 1))
          PY

          # 3.11 两份 librpc.a 重复符号：AirSim 自带的 deps/rpclib/lib/librpc.a（setup 时用
          #      libstdc++ 编出）与 CarlaDependencies/lib/librpc.a（libc++）同时进链接行，
          #      lld 报 22 个 duplicate symbol: rpc::server::*。只保留 Carla 的 libc++ 版。
          python3 - Unreal/CarlaUE4/Plugins/AirSim/Source/AirSim.Build.cs <<'PY'
          import io, sys
          p = sys.argv[1]
          s = io.open(p, encoding='utf-8').read()
          if 'hutb-ci] rpclib' in s:
              print('rpclib 去重补丁已存在，跳过')
          else:
              old = ('                LoadAirSimDependency(Target, "rpclib", "rpc");\n'
                     '                break;\n\n            case CompileMode.CppCompileNoRpc:')
              new = ('                // [hutb-ci] rpclib 由 CarlaDependencies 提供（libc++ 版），避免两份 librpc.a 重复符号\n'
                     '                // LoadAirSimDependency(Target, "rpclib", "rpc");\n'
                     '                break;\n\n            case CompileMode.CppCompileNoRpc:')
              if old in s:
                  io.open(p, 'w', encoding='utf-8').write(s.replace(old, new, 1))
                  print('rpclib 去重补丁已写入')
              else:
                  print('警告：AirSim.Build.cs 锚点未命中')
          PY

          # 3.12 Check.sh 启动模拟器只有 -RenderOffscreen；本机（远程桌面 + 新驱动）下
          #      Vulkan 会报 VK_ERROR_DEVICE_LOST，必须追加 -opengl 才能跑通 smoke/air/vr
          if [ -f Util/BuildTools/Check.sh ] && ! grep -q -- '-RenderOffscreen -opengl' Util/BuildTools/Check.sh; then
            sed -i 's|-RenderOffscreen --carla-rpc-port=3654|-RenderOffscreen -opengl --carla-rpc-port=3654|g' Util/BuildTools/Check.sh
          fi
          grep -n -- '-RenderOffscreen' Util/BuildTools/Check.sh | head -2

          # 3.13 Check.sh 启动模拟器后立刻开始跑用例，第一个用例会抢跑：
          #      "time-out of 120000ms while waiting for the simulator"
          #      在 nohup 启动行之后插一个 RPC 端口就绪等待（最多 180 秒）
          python3 - Util/BuildTools/Check.sh <<'PY'
          import io, sys
          p = sys.argv[1]
          s = io.open(p, encoding='utf-8').read()
          if '[hutb-ci] 等待 RPC' in s:
              print('端口等待已存在，跳过')
          else:
              out, injected = [], False
              for line in s.split('\n'):
                  out.append(line)
                  if (line.strip().startswith('nohup')
                          and 'carla-rpc-port=3654' in line):
                      out += [
                          '  # [hutb-ci] 等待 RPC 端口就绪，避免第一个用例抢跑超时',
                          '  for _i in $(seq 1 90); do',
                          '    (echo >/dev/tcp/127.0.0.1/3654) 2>/dev/null && break',
                          '    sleep 2',
                          '  done',
                      ]
                      injected = True
              if injected:
                  io.open(p, 'w', encoding='utf-8').write('\n'.join(out))
                  print('端口等待已注入')
              else:
                  print('警告：未找到模拟器启动行')
          PY

          echo "shim 就绪"

      # ------------------------------------------------------------------
      - name: 4. setup（下载依赖 + 生成 CMake 配置）
        run: |
          set -o pipefail
          # 全量模式：与上游一致，先跑仓库自带的 ./setup.sh（clone dependencies_u、安装 miniconda/apt 依赖）
          # 对应老师说的 "UE4 和下载依赖都重新开始"
          if [ "$MODE" = "full" ]; then
            echo "[full] 执行 ./setup.sh 从零准备依赖"
            ./setup.sh 2>&1 | tee /tmp/ci_setup_sh.log
          else
            # fast：复用服务器上的 AirSim 源码缓存。BuildUE4Plugins.sh 会优先
            # cp -a "$CACHE_DIR/AirSim"，避免每次从 GitHub clone（大仓库经常被代理重置/卡死）
            export CACHE_DIR=/home/yxkj/ci-assets
            # 缓存里不能带上一次的编译产物：CMakeCache.txt 里写死了旧的绝对路径，
            # 换到 CI 工作区会被 cmake 判定目录不一致直接失败
            rm -rf "$CACHE_DIR/AirSim/build_release" "$CACHE_DIR/AirSim/build_debug" "$CACHE_DIR/AirSim/cmake_build"
            rm -f "$CACHE_DIR/AirSim/cmake/CMakeCache.txt"
            rm -rf "$CACHE_DIR/AirSim/cmake/CMakeFiles"
            echo "[fast] AirSim 源码缓存 -> $CACHE_DIR/AirSim"
          fi
          # 清掉旧的 AirSim 构建目录，强制用 Step 3.10 打补丁后的工具链重编 AirLib
          rm -rf Build/AirSim
          make setup 2>&1 | tee /tmp/ci_setup.log

          # setup 里 AirSim 的 build.sh 会把新编的 .a 拷到 Build/AirSim/AirLib，
          # 但同步到 Unreal/CarlaUE4/Plugins/AirSim/Source/AirLib 的那一步带着
          # `rsync -a`（保留旧 mtime）且有条件判断，CI 里经常没刷新，导致插件目录
          # 仍是上一轮 g++(libstdc++) 编的 libMavLinkCom.a → 链接报 __cxx11 未定义。
          # 这里显式用新产物覆盖。
          AIR=Unreal/CarlaUE4/Plugins/AirSim/Source/AirLib
          cp -f Build/AirSim/AirLib/lib/libAirLib.a "$AIR/lib/libAirLib.a"
          cp -f Build/AirSim/AirLib/deps/MavLinkCom/lib/libMavLinkCom.a "$AIR/deps/MavLinkCom/lib/libMavLinkCom.a"
          # librpc.a 不覆盖：CarlaDependencies 的 libc++ 版已在链接行上，两份会 duplicate symbol
          ls -l "$AIR/lib/libAirLib.a" "$AIR/deps/MavLinkCom/lib/libMavLinkCom.a"

      # ------------------------------------------------------------------
      # 5. UE4 插件（AirSim/StreetMap 等）
      # 说明：make setup 已依赖 downloadplugins 并完成插件构建，这里不再重复执行
      # （仓库里的 Plugins.sh 有 bug：未 source Environment.sh，log 未定义，直接跑必失败）

      # ------------------------------------------------------------------
      - name: 6. 同步资源 Update.sh
        run: |
          set -o pipefail
          if [ -x Update.sh ]; then ./Update.sh 2>&1 | tee /tmp/ci_update.log; else echo "无 Update.sh，跳过"; fi

      # ------------------------------------------------------------------
      # LibCarla 无需单独编：CarlaUE4Editor 依赖 LibCarla.server.release，
      # PythonAPI.wheel 依赖 LibCarla.client.release，make 会自动带出来。
      - name: 7. 编译 CarlaUE4Editor
        run: |
          set -o pipefail
          # osm2odr 需要 zlib 头；用了 UE4 sysroot 后系统 /usr/include 不可见，单独拷一份用 CPATH 注入
          mkdir -p Build/zlib-include
          cp -f /usr/include/zlib.h /usr/include/zconf.h Build/zlib-include/ 2>/dev/null || true
          export CPATH="$PWD/Build/zlib-include${CPATH:+:$CPATH}"
          # 清掉旧配置（CMAKE_CXX_FLAGS 会随 setup 重跑不断叠加，导致参数重复十几份）
          rm -rf Build/LibCarla Build/LibCppToolChain.cmake
          # 不再拷贝本机 libAirLib.a：Step 4 已用 UE4 clang + libc++ 编出 ABI 一致的版本
          ls -l Unreal/CarlaUE4/Plugins/AirSim/Source/AirLib/lib/libAirLib.a || true
          make CarlaUE4Editor 2>&1 | tee /tmp/ci_editor.log

      # ------------------------------------------------------------------
      - name: 8. 构建 PythonAPI wheel（只做指定版本，默认 8 个版本太慢）
        run: |
          set -o pipefail
          make PythonAPI.wheel ARGS="--python-version=${PY_VER}" 2>&1 | tee /tmp/ci_wheel.log
          ls -lh PythonAPI/carla/dist/

      # ------------------------------------------------------------------
      - name: 9. 打包（Shipping + Cook）
        run: |
          set -o pipefail
          # ExitCode=137：拆 Unity 后的 Shipping 编译单元很吃内存，56 核并行会打满 62G。
          # 用 taskset 把可见 CPU 限到 6 核（UBT 按 nproc 决定并行度），峰值约 30G。
          nproc
          # 上传脚本只认 Build/UE4Carla 下最新的 .zip/.tar.gz，所以要上传时必须带压缩包；
          # 平时不上传就用 --no-zip 省掉一两个小时的压缩时间
          if [ "$UPLOAD" = "true" ]; then
            taskset -c 0-5 bash Util/BuildTools/Package.sh 2>&1 | tee /tmp/ci_package.log
          else
            taskset -c 0-5 bash Util/BuildTools/Package.sh --no-zip 2>&1 | tee /tmp/ci_package.log
          fi

      # ------------------------------------------------------------------
      # 与上游 build_linux.yml 的 check 段对齐；老师要求：上传前必须全部通过
      - name: 10. 自动化测试（make check.*）
        run: |
          set -o pipefail
          # 服务器上可能残留其他模拟器实例（比如直接跑二进制、不经 CarlaUE4.sh）。
          # Check.sh 只会 fuser -k 3654 和 pkill "CarlaUE4.sh"，杀不到它们；
          # 残留实例占着 2000 端口，会让新实例 bind: Address already in use 直接崩，所有用例超时。
          cleanup_sim() {
            pkill -f "CarlaUE4-Linux-Shipping" 2>/dev/null || true
            sleep 2
            fuser -k 2000/tcp 3654/tcp 2>/dev/null || true
            sleep 1
          }
          # 只测本次编出来的 Python 版本（上游默认 3.7~3.14 全跑，这里只建了 PY_VER 的 wheel）
          cleanup_sim
          make check.PythonAPI ARGS="--python-version=${PY_VER}" 2>&1 | tee /tmp/ci_check_pythonapi.log
          cleanup_sim
          make check.smoke     ARGS="--python-version=${PY_VER}" 2>&1 | tee /tmp/ci_check_smoke.log
          cleanup_sim
          make check.vr        ARGS="--python-version=${PY_VER}" 2>&1 | tee /tmp/ci_check_vr.log
          cleanup_sim
          make check.air       ARGS="--python-version=${PY_VER}" 2>&1 | tee /tmp/ci_check_air.log

      # ------------------------------------------------------------------
      # 老师原话：直接用仓库自带的 Util/download_from_git.py -u 上传，账号已内置；
      # Linux 下 -u release 会自动映射到腾讯工蜂的 release_u 仓库。
      # 默认关闭；只有上面全部 check 通过、手动把 upload 设成 true 才会执行。
      - name: 11. 上传发行包（download_from_git.py -u）
        if: env.UPLOAD == 'true'
        run: |
          set -o pipefail
          ls -lh Build/UE4Carla/*.tar.gz Build/UE4Carla/*.zip 2>/dev/null || {
            echo "Build/UE4Carla 下没有压缩包，UPLOAD=true 时打包必须带压缩"; exit 1; }
          python3 -c "import git" 2>/dev/null || python3 -m pip install -q gitpython
          # 脚本用 cwd 的上级目录推导 Build/UE4Carla，必须在 Util 下运行
          ( cd Util && python3 ./download_from_git.py -u release ) 2>&1 | tee /tmp/ci_check_upload.log

      # ------------------------------------------------------------------
      - name: 12. 汇总产物
        if: always()
        run: |
          echo "==== 产物目录 ===="
          ls -lh Build/UE4Carla/ | tail -5 || true
          echo "==== wheel ===="
          ls -lh PythonAPI/carla/dist/ || true
          echo "==== check 日志 ===="
          ls -lh /tmp/ci_check_*.log 2>/dev/null || true
          echo "==== 磁盘 ===="
          df -h "$GITHUB_WORKSPACE" | tail -1
